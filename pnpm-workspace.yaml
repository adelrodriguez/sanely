packages:
  - packages/*
  - tooling/*

# Every package builds and tests with the same tool versions.
catalog:
  "@types/node": 24.19.2
  "@vitest/coverage-v8": 5.1.0
  fast-check: 4.10.2
  tsdown: 0.23.5
  typescript: 7.1.0-beta
  vitest: 5.1.0

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - adamantite
  - packref
