name: ratelimit-performance-check

# Runs the @sanely/ratelimit benchmarks of a pull request and of its base branch in turns on one
# runner, and fails when a case regresses or goes over its budget in
# `packages/ratelimit/scripts/bench-budgets.ts`. It posts the results as one comment that each run
# updates.
#
# It runs only on a pull request with the `performance-check` label that changes the package. It is
# not a required check on `main`, so it does not block a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/ratelimit/**"
      - ".github/workflows/ratelimit-performance-check.yml"

permissions:
  contents: read

# A run that starts the benchmarks cancels the earlier one of the pull request, so the earlier run
# reports nothing. Opening a pull request with the label starts two such runs, one for `opened` and
# one for `labeled`. Every other run, such as one for another label, has a group of its own, so it
# cancels nothing. Keep this condition the same as the `if` of the `bench` job.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      contains(github.event.pull_request.labels.*.name, 'performance-check') &&
      (github.event.action != 'labeled' || github.event.label.name == 'performance-check') &&
      'bench' || github.run_id
    }}
  cancel-in-progress: true

jobs:
  bench:
    # Another label changes nothing, so it does not start the benchmarks again.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'performance-check') &&
      (github.event.action != 'labeled' || github.event.label.name == 'performance-check')
    # Not the bare store name, which the jobs in `ratelimit-stores.yml` use.
    name: bench (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Only the unit benchmarks can fail as a regression (see
      # `packages/ratelimit/scripts/bench-report.ts`), so only they need several rounds.
      matrix:
        include:
          - name: unit
            rounds: 3
            script: bench
            image: ""
            cli: ""
          - name: redis-store
            rounds: 1
            script: bench:redis-store
            image: redis:8
            cli: redis-cli
          - name: valkey-store
            rounds: 1
            script: bench:valkey-store
            image: valkey/valkey:8
            cli: valkey-cli
          - name: bun-redis-store
            rounds: 1
            script: bench:bun-redis-store
            image: redis:8
            cli: redis-cli

    services:
      server:
        # An empty image starts no service.
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.cli }} ping" --health-interval 2s --health-timeout 2s
          --health-retries 15

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Setup Bun
        if: matrix.name == 'bun-redis-store'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # The package imports `@sanely/core/time` and `@sanely/duration`, which resolve to their
          # build output.
          pnpm turbo run build --filter=@sanely/ratelimit^...
          if jq -e --arg script "$SCRIPT" '.scripts[$script]' base/packages/ratelimit/package.json > /dev/null; then
            pnpm --dir base install --frozen-lockfile
            pnpm --dir base exec turbo run build --filter=@sanely/ratelimit^...
          else
            echo "The base branch has no $SCRIPT script, so the report checks only the budgets."
          fi
        env:
          SCRIPT: ${{ matrix.script }}

      # Base and pull request run in turns on one runner, so a slow period on the runner affects
      # both. A base branch without this benchmark has no `node_modules`, and only the PR runs.
      - name: Run benchmarks
        env:
          NAME: ${{ matrix.name }}
          ROUNDS: ${{ matrix.rounds }}
          SCRIPT: ${{ matrix.script }}
        run: |
          for round in $(seq "$ROUNDS"); do
            if [ -d base/node_modules ]; then
              pnpm --dir base --filter @sanely/ratelimit run "$SCRIPT" --reporter=default --reporter=json \
                --outputFile.json="$GITHUB_WORKSPACE/bench-results/$NAME.base.$round.json"
            fi
            pnpm --filter @sanely/ratelimit run "$SCRIPT" --reporter=default --reporter=json \
              --outputFile.json="$GITHUB_WORKSPACE/bench-results/$NAME.$round.json"
          done

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: bench-results/

  # It reports the stores that finished, also when another store fails, and it is skipped when the
  # benchmarks are skipped. It runs the report script from the base branch, with a read-only token,
  # so code from the pull request never runs where a token can write. A change to the script or the
  # budgets therefore takes effect after it merges.
  report:
    name: ratelimit-performance-check
    needs: bench
    if: ${{ !cancelled() && needs.bench.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # A job output, not an artifact: the bench jobs run pull request code that can upload artifacts
    # to this run, but no other job can set this job's outputs.
    outputs:
      comment: ${{ steps.report.outputs.comment }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Download results
        # When every job fails, there is nothing to download. The report then lists every store.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: bench-results
          merge-multiple: true

      - name: Write report
        id: report
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node packages/ratelimit/scripts/bench-report.ts bench-results > report.md || status=$?
          {
            echo "<!-- ratelimit-performance-check -->"
            echo "## Performance check: @sanely/ratelimit"
            echo
            echo "Results for $SHA."
            echo
            cat report.md
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # A random delimiter, so no line of the report can end the output early.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "status=$status"
            echo "comment<<$delimiter"
            cat comment.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # The comment job still posts the results of a failed check.
      - name: Fail on a regression or a case over budget
        if: steps.report.outputs.status != '0'
        run: |
          echo "::error::A benchmark regressed or went over its budget. See the pull request comment."
          exit 1

  # The only job with a token that can write. It runs no code from the repository: it posts the
  # comment that the report job wrote.
  comment:
    name: ratelimit-performance-check comment
    needs: report
    if: ${{ !cancelled() && needs.report.outputs.comment != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Post comment
        env:
          BODY: ${{ needs.report.outputs.comment }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$BODY" > comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ratelimit-performance-check -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
