name: test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  types-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check type-check performance
        run: pnpm turbo run test:types-perf

  # Lists the packages to check and the `engines.node` floor of each.
  compat-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: List packages
        id: list
        run: echo "packages=$(node scripts/compat-packages.mjs)" >> "$GITHUB_OUTPUT"

  # Vitest needs a newer Node.js version than the `engines.node` floors. Build each package with
  # the default Node.js version, then run its `test:compat` script on its exact floor.
  compat-package:
    name: compat (${{ matrix.name }})
    needs: compat-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compat-packages.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=${{ matrix.name }}

      - name: Setup minimum Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # npm ships with every Node.js version, so the floor runs only the script and the package.
      - name: Run compatibility smoke test
        run: npm run test:compat --prefix ${{ matrix.directory }}

  # The `main` ruleset requires a check named `compat`, so this job reports the result of every
  # package in the matrix.
  compat:
    needs: compat-package
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.compat-package.result }}
        run: test "$RESULT" = "success"
